<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Campus OS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header>

        <div class="logo">
            <h1>Smart Campus OS</h1>
        </div>

        <nav>
            <ul>

                <li>
                    <a href="#">Home</a>
                </li>

                <li>
                    <a href="#events">Events</a>
                </li>

                <li>
                    <a href="#registration">Register</a>
                </li>

            </ul>
        </nav>

    </header>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main>

        <!-- ============================= -->
        <!-- HERO SECTION -->
        <!-- ============================= -->

        <section class="hero">

            <p class="hero-text">
                Your campus. Your events. Your community.
            </p>

            <button id="exploreBtn">
                View Campus Events
            </button>

        </section>


        <!-- ============================= -->
        <!-- EVENTS SECTION -->
        <!-- ============================= -->

        <section id="events">

            <h2>Upcoming Events</h2>

            <!-- Search -->
            <input
                type="text"
                id="searchInput"
                placeholder="Search events..."
            >

            <!-- Clear Search -->
            <button
                type="button"
                id="clearSearchBtn"
            >
                Clear Search
            </button>

            <!-- Sort by Date -->
            <button
                type="button"
                id="sortDateBtn"
            >
                Sort by Date
            </button>


            <!-- Dynamic Event Cards -->
            <div class="event-list">

                <div id="dynamicEvents"></div>

            </div>


            <!-- Event Details -->
            <p id="eventMessage"></p>

        </section>


        <!-- ============================= -->
        <!-- REGISTRATION SECTION -->
        <!-- ============================= -->

        <section id="registration">

            <h2>Register for an Event</h2>

            <form>

                <!-- Name -->

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >


                <!-- Email -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <!-- Department -->

                <label for="department">
                    Select Department
                </label>

                <select
                    id="department"
                    name="department"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Electrical Engineering">
                        Electrical Engineering
                    </option>

                    <option value="Mechanical Engineering">
                        Mechanical Engineering
                    </option>

                </select>


                <!-- Year -->

                <label for="year">
                    Select Year
                </label>

                <select
                    id="year"
                    name="year"
                    required
                >

                    <option value="">
                        Select Year
                    </option>

                    <option value="1">
                        S1
                    </option>

                    <option value="2">
                        S2
                    </option>

                    <option value="3">
                        S3
                    </option>

                    <option value="4">
                        S4
                    </option>

                </select>


                <!-- Reason -->

                <label for="reason">
                    Why do you want to attend?
                </label>

                <textarea
                    id="reason"
                    name="reason"
                    rows="4"
                    required
                ></textarea>


                <!-- Event -->

                <label for="event">
                    Event
                </label>

                <select
                    id="event"
                    name="event"
                    required
                >

                    <option value="">
                        Select Event
                    </option>

                    <option value="Tech Fest">
                        Tech Fest
                    </option>

                    <option value="Hackathon">
                        Hackathon
                    </option>

                    <option value="Cultural Fest">
                        Cultural Fest
                    </option>

                </select>


                <!-- Register -->

                <button type="submit">
                    Register
                </button>

            </form>


            <!-- Registration Message -->

            <p id="registrationMessage"></p>

        </section>

    </main>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer>

        <p>
            Smart Campus OS
        </p>

    </footer>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="script.js"></script>

</body>

</html>
